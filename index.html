<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17171B">
    <title>Fhoenix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app">

        <section class="pantalla" id="pantalla-hoy">
            
            <header class="hoy-top">
                <span class="texto-suave" id="hoy-fecha">Lunes · Semana 1 de 12</span>
                <button class="btn-icono" aria-label="Ajustes">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/>
                        <circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
                    </svg>
                </button>
            </header>

            <div class="hoy-centro">
                <h1 class="hoy-titulo">Hoy toca<br>entrenar,<br><span class="acento" id="hoy-nombre">Felipe</span></h1>
                <p class="texto-suave">Full body · 4 rondas · ~45 min</p>
            </div>

            <button class="btn-empezar">
                Empezar sesión
                <span class="btn-flecha">
                    <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </span>
            </button>

        </section>

        <nav class="nav">
            <button class="nav-item activo">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                Hoy
            </button>
            <button class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
                Progreso</button>
            <button class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 10v11"/><path d="M17 3c-2 0-3 2-3 5s1 4 3 4v9"/></svg>
                Comida
            </button>
            <button class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 7v4M10 7v3M14 7v4M18 7v3"/></svg>
                Medidas
            </button>
        </nav>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
